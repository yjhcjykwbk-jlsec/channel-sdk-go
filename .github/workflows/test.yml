name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.18.x", "1.26.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Verify dependencies
        run: go mod verify
      - name: Verify go.mod directive
        run: |
          test "$(go list -m -f '{{.GoVersion}}')" = "1.18"
          ! grep -q '^toolchain ' go.mod
      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: Verify license headers
        run: |
          missing=0
          while IFS= read -r file; do
            if ! head -n 15 "$file" | grep -Fqx '// Copyright (c) 2026 Lark Technologies Pte. Ltd.' || \
               ! head -n 15 "$file" | grep -Fqx '// SPDX-License-Identifier: MIT'; then
              echo "Missing or invalid license header: $file"
              missing=1
            fi
          done < <(git ls-files '*.go')
          test "$missing" -eq 0
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race Test
        run: go test -race ./...
      - name: Verify public package boundary
        run: |
          ! go list ./... | grep -E 'github.com/larksuite/channel-sdk-go/(normalize|outbound|safety|pipeline)$'
      - name: Verify root API surface
        run: |
          go doc github.com/larksuite/channel-sdk-go > /tmp/channel-sdk-go-doc.txt
          ! grep -E 'NewUpdateQueue|NewCardStreamController|NewMarkdownStreamController' /tmp/channel-sdk-go-doc.txt
